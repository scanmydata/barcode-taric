[project]
name = "barcodetaric"
version = "0.1.0"
description = "Πελατολόγιο & αντιστοίχιση barcode -> περιγραφή -> TARIC (τοπικό desktop app)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "scanmydata" }]
dependencies = [
    "requests>=2.31",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "googlesearch-python>=1.2.5",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
gui = ["pyside6>=6.6"]
crypto = ["cryptography>=41.0"]
# Τοπικά (offline) πολύγλωσσα embeddings για εννοιολογική αντιστοίχιση TARIC.
semantic = ["sentence-transformers>=2.6", "numpy>=1.24"]
# Headless browser search tier (πραγματικός Chrome μέσω Selenium). Προαιρετικό — το app
# δουλεύει και χωρίς αυτό (πέφτει σε DuckDuckGo/SearXNG). Χρειάζεται εγκατεστημένο Chrome.
headless = ["selenium>=4.20"]
# OFFLINE νευρωνική μετάφραση EL<->EN (Argos/OPUS-MT) — διατηρεί το νόημα, χωρίς δίκτυο.
# Το μοντέλο γλώσσας κατεβαίνει μία φορά. Χρήσιμο για μαζική αντιστοίχιση χωρίς κρέμασμα.
translate = ["argostranslate>=1.9"]
# Optional anti-bot / captcha handling for Cloudflare and similar protections.
# ΣΗΜ: το undetected-chromedriver χρειάζεται `setuptools` σε Python 3.12+ (import distutils).
anti_bot = ["cloudscraper>=1.2.0", "curl_cffi>=0.10.0", "undetected-chromedriver>=3.5.0",
            "setuptools>=69; python_version >= '3.12'"]

[project.scripts]
barcodetaric = "barcodetaric.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barcodetaric"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
